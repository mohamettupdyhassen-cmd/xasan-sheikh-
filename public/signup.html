<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mohamett.com - Sign Up</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">⚡ mohamett.com</div>
            <h2>Create Account</h2>
            <p class="subtitle">Start managing your trading infrastructure</p>

            <div id="errorMsg" class="error-msg" style="display:none;"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="Ahmed Mohamed">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <p class="switch-auth">Already have an account? <a href="/">Login</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
  </html>
