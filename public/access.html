<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mohamett.com - Access</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">⚡ mohamett.com</div>
            <h2>Restricted Access</h2>
            <p class="subtitle">Fadlan geli password-ka si aad u gasho</p>

            <div id="errorMsg" class="error-msg" style="display:none;"></div>

            <form id="accessForm">
                <div class="form-group">
                    <label>Access Password</label>
                    <input type="password" id="accessPassword" required placeholder="••••">
                </div>
                <button type="submit" class="btn-primary">Enter</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('accessForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('accessPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/access/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Password qaldan');
                }

                window.location.href = '/';

            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
